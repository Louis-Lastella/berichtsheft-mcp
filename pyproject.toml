[project]
name = "berichtsheft-mcp"
version = "0.1.0"
description = "MCP server: collect weekly work notes from Hermes sessions and fill the BLok Berichtsheft (online-ausbildungsnachweis.de)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp[cli]>=1.2.0,<2", "playwright>=1.44", "python-dotenv>=1.0.1"]

[project.scripts]
berichtsheft-mcp = "berichtsheft_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/berichtsheft_mcp"]
